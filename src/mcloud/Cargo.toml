[workspace]
members = [
    "crates/mcloud-common",
    "crates/mcloud-cli",
    "crates/mcloud-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arctrany/apple-cowork"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unix process management
nix = { version = "0.29", features = ["signal", "process", "hostname"] }

# Random (for TaskId)
rand = "0.8"

# System information
sysinfo = "0.30"

# Internal crates
mcloud-common = { path = "crates/mcloud-common" }
